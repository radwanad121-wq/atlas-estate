<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas Estate — Morocco</title><style>*{box-sizing:border-box}body{margin:0;background:#081018;color:#f4f7fb;font-family:Inter,system-ui,sans-serif}nav{padding:20px 6%;border-bottom:1px solid #223043;display:flex;justify-content:space-between}.brand{font-weight:900;font-size:20px}.brand b{color:#e44}.wrap{max-width:1150px;margin:auto;padding:55px 6%}.hero{padding:35px 0}.pill{border:1px solid #304056;border-radius:99px;padding:7px 12px;font-size:12px;color:#aebbd0}.hero h1{font-size:clamp(42px,7vw,76px);line-height:.95;margin:18px 0}.hero p{max-width:700px;color:#9da9bb;font-size:18px;line-height:1.7}.search{display:flex;gap:10px;background:#101925;padding:12px;border:1px solid #27364a;border-radius:15px}.search input{flex:1;background:none;border:0;color:white;outline:0;font-size:16px}.btn{background:#e44;color:white;border:0;border-radius:10px;padding:12px 17px;font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}.card{background:#101925;border:1px solid #223043;border-radius:18px;padding:18px}.photo{height:165px;border-radius:13px;background:linear-gradient(135deg,#26364a,#101720);display:flex;align-items:end;padding:12px}.muted{color:#929fb2}.price{font-size:21px;font-weight:900}</style></head><body><nav><div class="brand">ATLAS <b>ESTATE</b></div><span class="pill">MOROCCO PROPERTY</span></nav><main class="wrap"><section class="hero"><span class="pill">PROPERTY DISCOVERY</span><h1>Find your next<br><span style="color:#e44">address.</span></h1><p>A polished real-estate experience for apartments, villas and investment properties across Casablanca, Rabat and Marrakech.</p><div class="search"><input id="q" placeholder="Search city or property..." oninput="render()"><button class="btn" onclick="render()">Search</button></div></section><div id="grid" class="grid"></div></main><script>const homes=[['Ocean View Residence','Casablanca','1,850,000 MAD','3 bedrooms'],['Palm Garden Villa','Marrakech','3,900,000 MAD','5 bedrooms'],['Rabat Centre Loft','Rabat','1,420,000 MAD','2 bedrooms'],['Anfa Modern Apartment','Casablanca','2,250,000 MAD','3 bedrooms'],['Targa Family Home','Marrakech','2,100,000 MAD','4 bedrooms'],['Hay Riad Residence','Rabat','2,750,000 MAD','3 bedrooms']];function render(){let q=document.getElementById('q').value.toLowerCase();document.getElementById('grid').innerHTML=homes.filter(x=>x.join(' ').toLowerCase().includes(q)).map((x,i)=>`<article class="card"><div class="photo"><span class="pill">PROPERTY 0${i+1}</span></div><h2>${x[0]}</h2><div class="muted">${x[1]} • ${x[3]}</div><p class="price">${x[2]}</p><button class="btn" onclick="alert('Viewing request created for ${x[0]}')">Request viewing</button></article>`).join('')||'<p class="muted">No properties found.</p>'}render()</script></body></html>
